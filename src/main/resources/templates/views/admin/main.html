<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 홈 - LoaHub</title>
    <th:block th:fragment="pageCss">
        <style>
            .content {
                max-width: 100% !important;
                margin: 0 !important;
                padding: 15px 25px !important;
            }
            .admin-wrapper {
                width: 100%;
                max-width: 100%;
                height: calc(100vh - 120px);
                min-height: 820px;
                margin: 0;
                display: flex;
                gap: 25px;
                color: #e0e0e0;
                font-family: 'Spoqa Han Sans Neo', sans-serif;
                box-sizing: border-box;
            }
            .admin-sidebar {
                width: 240px;
                height: 100%;
                background-color: #1e1e24;
                border-radius: 8px;
                padding: 20px 10px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
            }
            .admin-sidebar h3 {
                padding: 0 15px 15px;
                margin: 0 0 10px;
                border-bottom: 1px solid #333;
                font-size: 18px;
                color: #fff;
            }
            .admin-sidebar ul {
                list-style: none;
                padding: 0;
                margin: 0;
            }
            .admin-sidebar li a {
                display: flex;
                align-items: center;
                padding: 12px 15px;
                color: #aaa;
                text-decoration: none;
                border-radius: 6px;
                font-size: 15px;
                margin-bottom: 5px;
                transition: all 0.2s;
            }
            .admin-sidebar li a:hover, .admin-sidebar li.active a {
                background-color: #3f51b5;
                color: #fff;
                font-weight: 500;
            }
            .admin-content {
                flex: 1;
                height: 100%;
                background-color: #1e1e24;
                border-radius: 8px;
                padding: 25px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                overflow-y: auto;
            }
            .dashboard-cards {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 20px;
                margin-top: 25px;
            }
            .card {
                background-color: #26262e;
                padding: 25px;
                border-radius: 8px;
                border: 1px solid #333;
                text-decoration: none;
                color: inherit;
                display: block;
                transition: transform 0.2s, border-color 0.2s;
            }
            .card:hover {
                transform: translateY(-4px);
                border-color: #3f51b5;
            }
            .card h4 {
                margin: 0 0 10px;
                font-size: 18px;
                color: #64b5f6;
            }
            .card p {
                margin: 0;
                color: #bbb;
                font-size: 14px;
                line-height: 1.5;
            }
        </style>
    </th:block>
</head>
<body>
<div th:replace="~{layout/layout :: layout(
        css = ~{::pageCss},
        content = ~{::mainContent},
        script = ~{::pageScript}
    )}">
    <th:block th:fragment="mainContent">
        <div class="admin-wrapper">
            <!-- 공통 사이드바 -->
            <nav class="admin-sidebar">
                <h3>관리자 메뉴</h3>
                <ul>
                    <li class="active"><a href="/admin/main">대시보드 홈</a></li>
                    <li><a href="/admin/users">멤버(유저) 관리</a></li>
                    <li><a href="/admin/synergies">직업 & 시너지 관리</a></li>
                </ul>
            </nav>

            <!-- 메인 대시보드 내용 -->
            <div class="admin-content">
                <h2>LoaHub 관리자 시스템</h2>
                <p style="color: #999;">시스템 전반의 회원 권한과 로스트아크 시너지 데이터를 통합 관리할 수 있는 패널입니다.</p>

                <div class="dashboard-cards">
                    <a href="/admin/users" class="card">
                        <h4>👥 멤버(유저) 관리</h4>
                        <p>가입된 회원 목록을 조회하고, 특정 계정에 <strong>ADMIN(관리자)</strong> 역할을 부여하거나 회수할 수 있습니다.</p>
                    </a>

                    <a href="/admin/synergies" class="card">
                        <h4>⚔️ 직업 & 시너지 데이터 관리</h4>
                        <p>신규 직업, 직업 각인, 스킬 및 트라이포드 시너지 수치를 입력하여 DB에 적재하고 실시간 시뮬레이터에 반영합니다.</p>
                    </a>
                </div>
            </div>
        </div>
    </th:block>

    <th:block th:fragment="pageScript">
    </th:block>
</div>
</body>
</html>
