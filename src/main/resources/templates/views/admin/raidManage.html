            .raid-category-label { display: block; margin-top: 5px; color: #aaa; font-size: 12px; }

            .raid-form label { display: grid; grid-template-columns: 130px 1fr; align-items: center; gap: 12px; margin: 14px 0; color: #bbb; }
            .raid-form input { min-width: 0; padding: 10px; border: 1px solid #444; border-radius: 4px; background: #1a1a1f; color: #fff; }
            .raid-admin button { padding: 9px 14px; border: 0; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; }

            #raid-new { background: #4caf50; } #raid-save { background: #2196f3; } #raid-delete { background: #f44336; }
            #raid-status { min-height: 20px; margin: 10px 0 0; color: #ffca28; }
