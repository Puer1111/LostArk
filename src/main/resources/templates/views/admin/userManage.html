<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>멤버 관리 - LoaHub Admin</title>
    <th:block th:fragment="pageCss">
        <style>
            .content {
                max-width: 100% !important;
                margin: 0 !important;
                padding: 15px 25px !important;
            }
            .admin-wrapper {
                width: 100%;
                max-width: 100%;
                height: calc(100vh - 120px);
                min-height: 820px;
                margin: 0;
                display: flex;
                gap: 25px;
                color: #e0e0e0;
                font-family: 'Spoqa Han Sans Neo', sans-serif;
                box-sizing: border-box;
            }
            .admin-sidebar {
                width: 240px;
                height: 100%;
                background-color: #1e1e24;
                border-radius: 8px;
                padding: 20px 10px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
            }
            .admin-sidebar h3 {
                padding: 0 15px 15px;
                margin: 0 0 10px;
                border-bottom: 1px solid #333;
                font-size: 18px;
                color: #fff;
            }
            .admin-sidebar ul {
                list-style: none;
                padding: 0;
                margin: 0;
            }
            .admin-sidebar li a {
                display: flex;
                align-items: center;
                padding: 12px 15px;
                color: #aaa;
                text-decoration: none;
                border-radius: 6px;
                font-size: 15px;
                margin-bottom: 5px;
                transition: all 0.2s;
            }
            .admin-sidebar li a:hover, .admin-sidebar li.active a {
                background-color: #3f51b5;
                color: #fff;
                font-weight: 500;
            }
            .admin-content {
                flex: 1;
                height: 100%;
                background-color: #1e1e24;
                border-radius: 8px;
                padding: 25px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .header-action {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
                flex-shrink: 0;
            }
            .table-container {
                flex: 1;
                overflow-y: auto;
            }
            .user-table {
                width: 100%;
                border-collapse: collapse;
                text-align: left;
                font-size: 14px;
            }
            .user-table th {
                background-color: #26262e;
                padding: 12px;
                border-bottom: 2px solid #444;
                color: #bbb;
            }
            .user-table td {
                padding: 12px;
                border-bottom: 1px solid #333;
            }
            .badge {
                padding: 4px 8px;
                border-radius: 4px;
                font-size: 12px;
                font-weight: bold;
            }
            .badge-admin {
                background-color: #e91e63;
                color: white;
            }
            .badge-user {
                background-color: #4caf50;
                color: white;
            }
            .btn {
                padding: 6px 12px;
                border-radius: 4px;
                border: none;
                cursor: pointer;
                font-weight: bold;
                font-size: 13px;
                transition: background 0.2s;
            }
            .btn-make-admin {
                background-color: #9c27b0;
                color: white;
            }
            .btn-make-user {
                background-color: #607d8b;
                color: white;
            }
            .btn:hover {
                opacity: 0.9;
            }
        </style>
    </th:block>
</head>
<body>
<div th:replace="~{layout/layout :: layout(
        css = ~{::pageCss},
        content = ~{::mainContent},
        script = ~{::pageScript}
    )}">
    <th:block th:fragment="mainContent">
        <div class="admin-wrapper">
            <!-- 공통 사이드바 -->
            <nav class="admin-sidebar">
                <h3>관리자 메뉴</h3>
                <ul>
                    <li><a href="/admin/main">대시보드 홈</a></li>
                    <li class="active"><a href="/admin/users">멤버(유저) 관리</a></li>
                    <li><a href="/admin/synergies">직업 & 시너지 관리</a></li>
                </ul>
            </nav>

            <!-- 멤버 관리 본문 -->
            <div class="admin-content">
                <div class="header-action">
                    <div>
                        <h2 style="margin: 0 0 5px 0;">👥 멤버(유저) 권한 관리</h2>
                        <span style="color: #888; font-size: 13px;">등록된 전체 회원의 역할을 관리하고 ADMIN 권한을 부여할 수 있습니다.</span>
                    </div>
                    <button id="btn-refresh-users" class="btn" style="background-color: #2196f3; color: white;">새로고침</button>
                </div>

                <div class="table-container">
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>아이디</th>
                                <th>닉네임</th>
                                <th>이메일</th>
                                <th>가입일</th>
                                <th>현재 역할</th>
                                <th>역할 변경</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body">
                            <!-- JS에서 동적 바인딩 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </th:block>

    <th:block th:fragment="pageScript">
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                loadUsers();
                document.getElementById('btn-refresh-users').addEventListener('click', loadUsers);
            });

            async function loadUsers() {
                const tbody = document.getElementById('user-table-body');
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #888;">회원 목록을 불러오는 중...</td></tr>';

                try {
                    const res = await fetch('/admin/api/users');
                    if (!res.ok) throw new Error('회원 목록 조회 실패');
                    const users = await res.json();

                    tbody.innerHTML = '';
                    if (users.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #888;">가입된 회원이 없습니다.</td></tr>';
                        return;
                    }

                    users.forEach(user => {
                        const tr = document.createElement('tr');
                        const isAdmin = user.userRole === 'ADMIN';
                        const createdDate = user.createdAt ? user.createdAt.split('T')[0] : '-';

                        tr.innerHTML = `
                            <td>${user.userNo}</td>
                            <td><strong>${user.userId || '-'}</strong></td>
                            <td>${user.userNickName}</td>
                            <td>${user.userEmail}</td>
                            <td>${createdDate}</td>
                            <td>
                                <span class="badge ${isAdmin ? 'badge-admin' : 'badge-user'}">${user.userRole}</span>
                            </td>
                            <td>
                                ${isAdmin 
                                    ? `<button class="btn btn-make-user" onclick="toggleRole('${user.userId}', 'USER')">USER로 강등</button>` 
                                    : `<button class="btn btn-make-admin" onclick="toggleRole('${user.userId}', 'ADMIN')">ADMIN 부여</button>`
                                }
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } catch (err) {
                    console.error(err);
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #f44336;">오류: ${err.message}</td></tr>`;
                }
            }

            async function toggleRole(userId, targetRole) {
                if (!confirm(`[${userId}] 사용자의 권한을 '${targetRole}'(으)로 변경하시겠습니까?`)) {
                    return;
                }

                try {
                    const res = await fetch(`/admin/api/users/${userId}/role`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ role: targetRole })
                    });

                    if (!res.ok) {
                        const msg = await res.text();
                        throw new Error(msg || '권한 변경 실패');
                    }

                    alert(`성공적으로 ${targetRole} 권한으로 변경되었습니다!\n※ 해당 계정으로 로그인된 상태라면 재로그인 시 ADMIN 권한이 적용됩니다.`);
                    await loadUsers();
                } catch (err) {
                    console.error(err);
                    alert('오류 발생: ' + err.message);
                }
            }
        </script>
    </th:block>
</div>
</body>
</html>
