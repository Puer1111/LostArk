<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>실시간 레이드 파티 시뮬레이터 & 추천기</title>
    <link th:fragment="pageCss" rel="stylesheet" href="/css/character/partySimulator.css">
</head>
<body>
<div th:replace="~{layout/layout :: layout(
        css = ~{::pageCss},
        content = ~{::mainContent},
        script = ~{::pageScript}
    )}">
    <th:block th:fragment="mainContent">
    <div class="simulator-body-container">
        <!-- 좌측 클래스 선택 영역 -->
        <div id="class-selection">
            <!-- 닉네임 검색 영역 추가 -->
            <div class="search-section">
                <h2>닉네임으로 검색</h2>
                <div class="search-box">
                    <input type="text" id="character-search-input" placeholder="캐릭터명 입력">
                    <button id="character-search-btn">조회</button>
                </div>
            </div>

            <div class="class-list-section">
                <h2>클래스 목록</h2>
                <div id="class-groups-container">
                    <!-- DB 데이터(synergyService) 기반 동적 렌더링 -->
                </div>
            </div>
        </div>

        <!-- 중앙 메인 시뮬레이터 영역 -->
        <div class="main-content-area">
            <div id="simulator-header">
                <div class="selection-group">
                    <!-- 카테고리 커스텀 셀렉트 -->
                    <div class="custom-select-box" id="category-custom-box">
                        <div class="custom-select-trigger">종류 선택</div>
                        <div class="custom-options" id="category-options">
                            <!-- JS에서 생성 -->
                        </div>
                        <select id="category-select" style="display: none;">
                            <option value="none">종류 선택</option>
                        </select>
                    </div>

                    <!-- 레이드 커스텀 셀렉트 -->
                    <div class="custom-select-box" id="raid-custom-box">
                        <div class="custom-select-trigger">레이드 선택</div>
                        <div class="custom-options" id="raid-options">
                            <!-- JS에서 생성 -->
                        </div>
                        <select id="raid-select" style="display: none;">
                            <option value="none">레이드 선택</option>
                        </select>
                    </div>
                </div>
                <div class="action-group">
                    <button id="share-btn">공유하기</button>
                    <button id="reset-btn">초기화</button>
                </div>
            </div>

            <div class="raid-board">
                <!-- 1파티 -->
                <div class="party-container" data-party-id="1">
                    <h3>1 파티</h3>
                    <div class="party-slots">
                        <div class="party-slot" data-slot-id="1"><span>슬롯 1</span></div>
                        <div class="party-slot" data-slot-id="2"><span>슬롯 2</span></div>
                        <div class="party-slot" data-slot-id="3"><span>슬롯 3</span></div>
                        <div class="party-slot" data-slot-id="4"><span>슬롯 4</span></div>
                    </div>
                </div>

                <!-- 2파티 -->
                <div class="party-container" data-party-id="2">
                    <h3>2 파티</h3>
                    <div class="party-slots">
                        <div class="party-slot" data-slot-id="5"><span>슬롯 5</span></div>
                        <div class="party-slot" data-slot-id="6"><span>슬롯 6</span></div>
                        <div class="party-slot" data-slot-id="7"><span>슬롯 7</span></div>
                        <div class="party-slot" data-slot-id="8"><span>슬롯 8</span></div>
                    </div>
                </div>
            </div>

            <!-- 하단 추천 및 메시지 영역 -->
            <div id="recommendation-area">
                <h3>시너지 추천 및 가이드</h3>
                <div id="recommendation-list">
                    <p>파티원을 추가하면 실시간으로 분석하여 최적의 클래스를 추천해 드립니다.</p>
                </div>
            </div>
        </div>

        <!-- 우측 상세 시너지 패널 -->
        <div class="synergy-details-area">
            <h2>공격대 시너지 리포트</h2>

            <div class="party-detail-section">
                <div class="p-header">1 파티 시너지</div>
                <div id="synergy-party-1" class="p-content">
                    <p class="empty-msg">정보 없음</p>
                </div>
            </div>

            <div class="party-detail-section">
                <div class="p-header">2 파티 시너지</div>
                <div id="synergy-party-2" class="p-content">
                    <p class="empty-msg">정보 없음</p>
                </div>
            </div>
        </div>
    </div>
    </th:block>

    <th:block th:fragment="pageScript">
        <script type="module" src="/js/partySimulator/partySimulator.js"></script>
    </th:block>
</div>
</body>
</html>
