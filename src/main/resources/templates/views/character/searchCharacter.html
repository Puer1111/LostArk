<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lost Ark Character Details</title>
</head>
<body>
<div th:replace="~{layout/layout :: layout(
        css = ~{::pageCss},
        content = ~{::mainContent},
        script = ~{::pageScript}
    )}">
    <th:block th:fragment="pageCss">
        <link rel="stylesheet" href="/css/character/searchCharacter.css">
    </th:block>

    <th:block th:fragment="mainContent">
        <div class="container">
            <!-- =================================================================
                 1. 상단 요약 바 (전체 폭, 4칸 그리드 - 동적 Thymeleaf 바인딩)
                 ================================================================= -->
            <header class="summary-bar">
                <div class="summary-item">
                    <span class="summary-label">아이템 레벨</span>
                    <span class="summary-value"
                          th:text="${characterData?.characterProfiles?.itemAvgLevel} ?: '-'">-</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">전투력</span>
                    <span class="summary-value"
                          th:text="${characterData?.characterProfiles?.CombatPower} ?: '-'">-</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">직업</span>
                    <span class="summary-value"
                          th:text="${characterData?.characterProfiles?.characterClassName} ?: '-'">-</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">서버 / 길드</span>
                    <span class="summary-value"
                          th:text="(${characterData?.characterProfiles?.serverName} ?: '-') + ' / ' + (${characterData?.characterProfiles?.guildName != null and !characterData.characterProfiles.guildName.isEmpty()} ? ${characterData.characterProfiles.guildName} : '-')">-</span>
                </div>
            </header>

            <!-- =================================================================
                 2. 본문 2단 레이아웃 (왼쪽 고정 컬럼 + 오른쪽 탭 영역)
                 ================================================================= -->
            <div class="layout-main">
                <!-- -------------------------------------------------------------
                     왼쪽 고정 컬럼 (180px, 데스크톱 sticky top: 16px)
                     ------------------------------------------------------------- -->
                <aside class="left-column">
                    <div class="card profile-card">
                        <!-- 캐릭터 이미지 -->
                        <div class="avatar-box">
                            <img th:if="${characterData?.characterProfiles?.characterImage != null and !characterData.characterProfiles.characterImage.isEmpty()}"
                                 th:src="${characterData.characterProfiles.characterImage}"
                                 alt="캐릭터 이미지"/>
                            <span th:if="${characterData?.characterProfiles?.characterImage == null or characterData.characterProfiles.characterImage.isEmpty()}">캐릭터 이미지</span>
                        </div>

                        <!-- 기본 정보 -->
                        <div class="profile-meta">
                            <h1 class="character-name"
                                th:text="${characterData?.characterProfiles?.characterName} ?: '-'">-</h1>
                            <p class="character-level"
                               th:text="'전투 Lv.' + (${characterData?.characterProfiles?.characterLevel} ?: '-') + ' / ' + (${characterData?.characterProfiles?.characterClassName} ?: '-')"></p>
                        </div>

                        <!-- 정보 갱신 버튼 -->
                        <div class="refresh-container">
                            <button id="refresh-btn" class="refresh-btn" type="button">🔄 정보 갱신</button>
                            <span id="refresh-cooldown" class="cooldown-text"></span>
                        </div>

                        <!-- 각인 효과 목록 -->
                        <div class="profile-engravings"
                             th:if="${characterData?.characterEngravings != null and characterData.characterEngravings.arkPassiveEffects != null}">
                            <div class="card-subtitle">각인 효과</div>
                            <ul class="engravings-list">
                                <li class="engraving-row"
                                    th:each="effect : ${characterData.characterEngravings.arkPassiveEffects}"
                                    th:if="${effect.grade != null}">
                                    <div class="engraving-item-content"
                                         th:data-grade="${effect.grade}"
                                         th:data-level="${effect.level}">
                                        <img th:src="@{/img/engravings/{name}.webp(name=${effect.name})}"
                                             th:alt="${effect.name}"
                                             class="engraving-img-icon"
                                             onerror="this.style.display='none';"/>
                                        <span class="engraving-name" th:text="${effect.name}"></span>
                                        <div class="engraving-info-group">
                                            <em class="engraving-icon"
                                                th:data-engraving-name="${effect.name}"></em>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </aside>

                <!-- -------------------------------------------------------------
                     오른쪽 영역: 탭 네비게이션 + 탭별 컨텐츠
                     ------------------------------------------------------------- -->
                <section class="right-column">
                    <!-- 탭 바 (data-target 속성으로 searchCharacter.js 탭 시스템 연동) -->
                    <nav class="tabs-nav" aria-label="캐릭터 상세 정보 탭">
                        <button type="button" class="tab-btn active" data-target="equipment">장비</button>
                        <button type="button" class="tab-btn" data-target="avatar">아바타</button>
                        <button type="button" class="tab-btn" data-target="skills">스킬</button>
                        <button type="button" class="tab-btn" data-target="ark-grid">아크 그리드</button>
                        <button type="button" class="tab-btn" data-target="ark-passive">아크 패시브</button>
                        <button type="button" class="tab-btn" data-target="expedition">원정대</button>
                    </nav>

                    <!-- =========================================================
                         [탭 1] 장비 탭 (기본 노출)
                         - 좌: 장비 5종 + 무기 + 완갑 + 보주
                         - 우: 장신구 (목걸이, 귀걸이, 반지) + 팔찌 + 어빌리티 스톤
                         - 보석: 피해/쿨감 분리 및 컴팩트 배치
                         - 아크패시브: 총 포인트 제거, 아이콘/이름/레벨 한눈에 보기
                         - 아크그리드: 아이콘, 이름, 활성화포인트 + 젬 합산 노출
                         ========================================================= -->
                    <div id="equipment" class="tab-content" style="display: flex;">
                        <!-- 장비 & 장신구 카드 -->
                        <div class="card equipment-card"
                             th:if="${characterData?.characterEquipment != null and !characterData.characterEquipment.empty}">
                            <div class="card-header">장비 및 장신구</div>
                            <div class="equipment-columns">
                                <!-- 왼쪽 컬럼: 무기, 투구, 어깨, 상의, 하의, 장갑, 보주, 완갑 -->
                                <div class="equipment-left">
                                    <ul class="equipment-list">
                                        <!-- 1. 무기 및 방어구 5종 -->
                                        <li class="equipment-item"
                                            th:each="item : ${characterData.characterEquipment}"
                                            th:if="${item.type == '무기' or item.type == '투구' or item.type == '어깨' or item.type == '상의' or item.type == '하의' or item.type == '장갑'}">
                                            <div class="equipment-area">
                                                <div class="item-img">
                                                    <img th:src="${item.icon}" alt="아이템 아이콘"/>
                                                </div>
                                                <div class="item-description">
                                                    <div class="item-name-row">
                                                        <span class="item-name" th:text="${item.name}"></span>
                                                        <th:block th:if="${item.tooltip != null and !item.tooltip.getAdvancedHoningLevel().isEmpty()}">
                                                            <span class="item-honing" th:text="'+' + ${item.tooltip.getAdvancedHoningLevel()}"></span>
                                                        </th:block>
                                                    </div>
                                                </div>
                                            </div>
                                        </li>

                                        <!-- 2. 보주 -->
                                        <li class="equipment-item"
                                            th:each="item : ${characterData.characterEquipment}"
                                            th:if="${item.type == '보주'}">
                                            <div class="equipment-area">
                                                <div class="item-img">
                                                    <img th:src="${item.icon}" alt="보주 아이콘"/>
                                                </div>
                                                <div class="item-description">
                                                    <div class="item-name-row">
                                                        <span class="item-name" th:text="${item.name}"></span>
                                                    </div>
                                                    <th:block th:if="${item.tooltip != null}">
                                                        <div class="item-orb" th:text="${item.tooltip.getOrbParadisePower()}"></div>
                                                    </th:block>
                                                </div>
                                            </div>
                                        </li>

                                        <!-- 3. 보주 다음에 완갑 -->
                                        <li class="equipment-item"
                                            th:each="item : ${characterData.characterEquipment}"
                                            th:if="${item.type == '완갑'}">
                                            <div class="equipment-area">
                                                <div class="item-img">
                                                    <img th:src="${item.icon}" alt="완갑 아이콘"/>
                                                </div>
                                                <div class="item-description">
                                                    <div class="item-name-row">
                                                        <span class="item-name" th:text="${item.name}"></span>
                                                        <th:block th:if="${item.tooltip != null and !item.tooltip.getAdvancedHoningLevel().isEmpty()}">
                                                            <span class="item-honing" th:text="'+' + ${item.tooltip.getAdvancedHoningLevel()}"></span>
                                                        </th:block>
                                                    </div>
                                                    <th:block th:if="${item.tooltip != null}">
                                                        <div class="item-gauntlet" th:utext="${item.tooltip.getNestedElementHtml('Element_006', 'Element_001')}"></div>
                                                    </th:block>
                                                </div>
                                            </div>
                                        </li>
                                    </ul>
                                </div>

                                <!-- 오른쪽 컬럼: 목걸이, 귀걸이, 반지, 팔찌, 어빌리티 스톤 -->
                                <div class="equipment-right">
                                    <ul class="accessory-list">
                                        <li class="accessory-item"
                                            th:each="item : ${characterData.characterEquipment}"
                                            th:if="${item.type == '목걸이' or item.type == '귀걸이' or item.type == '반지' or item.type == '팔찌' or item.type == '어빌리티 스톤'}">
                                            <div class="equipment-area" th:if="${item.tooltip != null}">
                                                <div class="item-img">
                                                    <img th:src="${item.icon}" alt="아이템 아이콘"/>
                                                </div>
                                                <div class="accessory-description">
                                                    <div class="acc-part-main" th:utext="${item.tooltip.getElementHtml('Element_005')}"></div>
                                                    <th:block th:if="${item.type == '목걸이' or item.type == '귀걸이' or item.type == '반지'}">
                                                        <div class="acc-part-sub" th:utext="${item.tooltip.getNestedElementHtml('Element_006', 'Element_001')}"></div>
                                                    </th:block>
                                                    <div class="acc-part-engraving" th:utext="${item.tooltip.extractEngravings()}"></div>
                                                </div>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <!-- 보석 카드 (스타일 유지 + 칸 축소 + 피해 / 쿨감 보석 분리) -->
                        <div class="card gems-card"
                             th:if="${characterData?.characterGems?.gems != null and !characterData.characterGems.gems.empty}">
                            <div class="card-header">장착 보석</div>
                            <div class="gems-split-container">
                                <!-- 1. 피해 증가 보석 영역 -->
                                <div class="gem-group-section gem-section-damage">
                                    <div class="gem-group-badge badge-damage">피해 증가</div>
                                    <div class="gem-list">
                                        <th:block th:each="item : ${characterData.characterGems.gems}"
                                                  th:if="${item.tooltip != null and item.tooltip.getPrimaryEffectType() == 'INCREASE'}">
                                            <div class="gem-slot-item">
                                                <div class="gem-icon-wrapper">
                                                    <th:block th:if="${characterData.characterGems.effects?.skills != null}">
                                                        <th:block th:each="skill : ${characterData.characterGems.effects.skills}"
                                                                  th:if="${skill.gemSlot == item.slot}">
                                                            <!-- 스킬 이미지 (메인) -->
                                                            <img th:src="${skill.icon}" class="gem-img"
                                                                 th:title="${skill.name}" alt="Skill Icon"
                                                                 th:classappend="${item.tooltip.getGemLevelClass(item.level)}"/>
                                                            <!-- 보석 이미지 (overlay) -->
                                                            <img alt="Gem Icon" th:src="${item.icon}" class="gem-skill-badge"
                                                                 th:title="${item.name}"/>
                                                        </th:block>
                                                    </th:block>
                                                </div>
                                                <span class="gem-level-label text-damage"
                                                      th:text="${item.level} + '겁'"></span>
                                            </div>
                                        </th:block>
                                    </div>
                                </div>

                                <!-- 그룹 간 세로 구분선 -->
                                <div class="gem-group-divider"></div>

                                <!-- 2. 쿨타임 감소 보석 영역 -->
                                <div class="gem-group-section gem-section-cooldown">
                                    <div class="gem-group-badge badge-cooldown">재사용 대기시간 감소</div>
                                    <div class="gem-list">
                                        <th:block th:each="item : ${characterData.characterGems.gems}"
                                                  th:if="${item.tooltip != null and item.tooltip.getPrimaryEffectType() == 'DECREASE'}">
                                            <div class="gem-slot-item">
                                                <div class="gem-icon-wrapper">
                                                    <th:block th:if="${characterData.characterGems.effects?.skills != null}">
                                                        <th:block th:each="skill : ${characterData.characterGems.effects.skills}"
                                                                  th:if="${skill.gemSlot == item.slot}">
                                                            <!-- 스킬 이미지 (메인) -->
                                                            <img th:src="${skill.icon}" class="gem-img"
                                                                 th:title="${skill.name}" alt="Skill Icon"
                                                                 th:classappend="${item.tooltip.getGemLevelClass(item.level)}"/>
                                                            <!-- 보석 이미지 (overlay) -->
                                                            <img alt="Gem Icon" th:src="${item.icon}" class="gem-skill-badge"
                                                                 th:title="${item.name}"/>
                                                        </th:block>
                                                    </th:block>
                                                </div>
                                                <span class="gem-level-label text-cooldown"
                                                      th:text="${item.level} + '작'"></span>
                                            </div>
                                        </th:block>
                                    </div>
                                </div>

                                <!-- 3. 기타 보석 영역 (있는 경우) -->
                                <th:block th:if="${#lists.contains(characterData.characterGems.gems.![tooltip != null ? tooltip.getPrimaryEffectType() : 'NONE'], 'NONE')}">
                                    <div class="gem-group-divider"></div>
                                    <div class="gem-group-section gem-section-other">
                                        <div class="gem-group-badge badge-other">기타</div>
                                        <div class="gem-list">
                                            <th:block th:each="item : ${characterData.characterGems.gems}"
                                                      th:if="${item.tooltip == null or (item.tooltip.getPrimaryEffectType() != 'INCREASE' and item.tooltip.getPrimaryEffectType() != 'DECREASE')}">
                                                <div class="gem-slot-item">
                                                    <div class="gem-icon-wrapper">
                                                        <th:block th:if="${characterData.characterGems.effects?.skills != null}">
                                                            <th:block th:each="skill : ${characterData.characterGems.effects.skills}"
                                                                      th:if="${skill.gemSlot == item.slot}">
                                                                <!-- 스킬 이미지 (메인) -->
                                                                <img th:src="${skill.icon}" class="gem-img"
                                                                     th:title="${skill.name}" alt="Skill Icon"
                                                                     th:classappend="${item.tooltip != null ? item.tooltip.getGemLevelClass(item.level) : 'gem-border-base'}"/>
                                                                <!-- 보석 이미지 (overlay) -->
                                                                <img alt="Gem Icon" th:src="${item.icon}" class="gem-skill-badge"
                                                                     th:title="${item.name}"/>
                                                            </th:block>
                                                        </th:block>
                                                    </div>
                                                    <span class="gem-level-label text-other"
                                                          th:text="${item.level} + '렙'"></span>
                                                </div>
                                            </th:block>
                                        </div>
                                    </div>
                                </th:block>
                            </div>
                        </div>

                        <!-- 아크 패시브 & 아크 그리드 2열 카드 -->
                        <div class="overview-split-grid">
                            <!-- 아크 패시브 카드 (총합 포인트 제거, 이미지 + 이름 + 레벨 한눈에 보기) -->
                            <div class="card ark-passive-card"
                                 th:if="${characterData?.characterArkPassive != null}">
                                <div class="card-header">아크 패시브</div>
                                <div class="ark-passive-simple-cols"
                                     th:if="${characterData.characterArkPassive.points != null and !characterData.characterArkPassive.points.empty}">
                                    <div class="ark-passive-category"
                                         th:each="point : ${characterData.characterArkPassive.points}">
                                        <div class="ark-cat-title" th:text="'[' + ${point.name} + ']'"></div>
                                        <div class="ark-effect-list">
                                            <div class="ark-effect-item"
                                                 th:each="effect : ${characterData.characterArkPassive.effects}"
                                                 th:if="${effect.name == point.name}">
                                                <div class="ark-effect-left">
                                                    <img th:if="${effect.icon != null and !effect.icon.isEmpty()}"
                                                         th:src="${effect.icon}"
                                                         alt="Effect Icon"
                                                         class="ark-effect-icon"/>
                                                    <span class="ark-effect-name" th:text="${effect.pureName}"></span>
                                                </div>
                                                <span class="ark-effect-level" th:text="${effect.pureLevel}"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- 하단 전투 특성 카드 박스 (아크패시브 카테고리와 동일한 카드 형태) -->
                                <div class="ark-passive-stats-container"
                                     th:if="${characterData?.characterProfiles?.stats != null and !characterData.characterProfiles.stats.empty}">
                                    <div class="ark-passive-category">
                                        <div class="ark-cat-title">[전투 특성]</div>
                                        <div class="ark-stats-list-grid">
                                            <!-- 1열(좌측): 치명, 특화, 신속 -->
                                            <div class="ark-effect-item"
                                                 th:each="stat : ${characterData.characterProfiles.stats}"
                                                 th:if="${stat.type == '치명' or stat.type == '특화' or stat.type == '신속'}">
                                                <div class="ark-effect-left">
                                                    <span class="ark-effect-name" th:text="${stat.type}"></span>
                                                </div>
                                                <span class="ark-effect-level" th:text="${stat.value}"></span>
                                            </div>
                                            <!-- 2열(우측): 제압, 인내, 숙련 -->
                                            <div class="ark-effect-item"
                                                 th:each="stat : ${characterData.characterProfiles.stats}"
                                                 th:if="${stat.type == '제압' or stat.type == '인내' or stat.type == '숙련'}">
                                                <div class="ark-effect-left">
                                                    <span class="ark-effect-name" th:text="${stat.type}"></span>
                                                </div>
                                                <span class="ark-effect-level" th:text="${stat.value}"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 아크 그리드 카드 (이미지, 이름, 활성화포인트 순서 + 젬 합산 표기) -->
                            <div class="card ark-grid-card"
                                 th:if="${characterData?.characterArkGrid != null}">
                                <div class="card-header">아크 그리드</div>
                                <!-- 아크 그리드 슬롯: 이미지, 이름, 활성화포인트 순 -->
                                <div class="ark-grid-simple-list"
                                     th:if="${characterData.characterArkGrid.slots != null and !characterData.characterArkGrid.slots.empty}">
                                    <div class="ark-grid-slot-row"
                                         th:each="slot : ${characterData.characterArkGrid.slots}">
                                        <div class="ark-grid-slot-left">
                                            <img th:src="${slot.icon}" alt="슬롯 아이콘" class="ark-grid-slot-icon"/>
                                            <span class="ark-grid-slot-name" th:text="${slot.name}"></span>
                                        </div>
                                        <span class="ark-grid-slot-point" th:text="${slot.point} + 'P'"></span>
                                    </div>
                                </div>

                                <!-- Gem(젬) 합산 효과 표기 -->
                                <div class="ark-grid-gems-summary"
                                     th:with="combinedGems=${characterData.characterArkGrid.getAllCombinedGemEffects()}">
                                    <div class="ark-grid-gems-title">[젬 효과 합산]</div>
                                    <div class="ark-grid-gems-list" th:if="${combinedGems != null and !combinedGems.empty}">
                                        <div class="ark-gem-effect-item"
                                             th:each="effectStr : ${combinedGems}"
                                             th:classappend="${characterData.characterArkGrid.isCoreGemEffect(effectStr)} ? 'is-core' : ''">
                                            <span th:text="${effectStr}"></span>
                                        </div>
                                    </div>
                                    <div class="no-data-text" th:if="${combinedGems == null or combinedGems.empty}">
                                        <span>적용된 젬 효과가 없습니다.</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- =========================================================
                         [탭 2] 아바타 탭
                         ========================================================= -->
                    <div id="avatar" class="tab-content" style="display: none;">
                        <div class="card"
                             th:if="${characterData?.characterAvatars != null and !characterData.characterAvatars.empty}">
                            <div class="card-header">장착 아바타</div>
                            <div class="avatar-grid">
                                <div class="avatar-item" th:each="avatar : ${characterData.characterAvatars}">
                                    <div class="avatar-img-wrapper">
                                        <img th:src="${avatar.icon}" alt="아바타 아이콘"/>
                                        <span th:if="${avatar.isInner}" class="avatar-inner-badge">덧입기</span>
                                    </div>
                                    <div class="avatar-info">
                                        <span class="avatar-type" th:text="${avatar.type}"></span>
                                        <span class="avatar-name" th:text="${avatar.name}"></span>
                                        <div class="avatar-grade-row">
                                            <span th:text="${avatar.grade}" class="avatar-grade"
                                                  th:style="'color: ' + (${avatar.grade == '전설'} ? 'var(--grade-legend)' : (${avatar.grade == '영웅'} ? 'var(--grade-hero)' : 'var(--grade-rare)'))"></span>
                                            <span th:if="${avatar.isSet}" class="avatar-set-badge">(세트 적용)</span>
                                        </div>
                                        <!-- 아바타 염색 정보 -->
                                        <div class="avatar-dyes"
                                             th:if="${avatar.getDyeInfoList() != null and !avatar.getDyeInfoList().empty}">
                                            <div th:each="dye : ${avatar.getDyeInfoList()}" class="dye-item">
                                                <span th:text="${dye.part} + ':'" class="dye-part"></span>
                                                <span th:if="${dye.baseColor != null and !dye.baseColor.isEmpty() and dye.baseColor != 'null' and dye.baseColor != 'undefined'}"
                                                      class="dye-color-box">
                                                    <span class="color-dot" th:style="'background-color: ' + ${dye.baseColor}"></span>
                                                    <span th:text="${dye.baseColor}"></span>
                                                </span>
                                                <span th:if="${dye.glossValue != null and !dye.glossValue.isEmpty() and dye.glossValue != 'null'}"
                                                      th:text="'광택 ' + ${dye.glossValue}"></span>
                                                <span th:if="${dye.patternColor != null and !dye.patternColor.isEmpty() and dye.patternColor != 'null' and dye.patternColor != 'undefined'}"
                                                      class="dye-color-box">
                                                    <span class="color-dot" th:style="'background-color: ' + ${dye.patternColor}"></span>
                                                    <span th:text="'패턴#' + ${dye.patternColor}"></span>
                                                </span>
                                                <span th:if="${dye.iconPath != null and !dye.iconPath.isEmpty() and dye.iconPath != 'null'}">
                                                    <img th:src="${dye.iconPath}" alt="패턴" class="pattern-img"/>
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card no-data"
                             th:if="${characterData?.characterAvatars == null or characterData.characterAvatars.empty}">
                            <p>장착 중인 아바타가 없습니다.</p>
                        </div>
                    </div>

                    <!-- =========================================================
                         [탭 3] 스킬 탭
                         ========================================================= -->
                    <div id="skills" class="tab-content" style="display: none;">
                        <div class="card" th:if="${characterData?.characterCombatSkill != null}">
                            <div class="card-header">전투 스킬</div>
                            <ul class="skill-list">
                                <li th:each="skill : ${characterData.characterCombatSkill}" th:if="${skill.rune != null}"
                                    class="skill-item">
                                    <!-- 스킬 기본 정보 -->
                                    <img th:src="${skill.icon}" alt="Skill Icon" class="skill-main-icon"/>
                                    <div class="skill-info">
                                        <div class="skill-name-area">
                                            <strong th:text="${skill.name}" class="skill-name"></strong>
                                            <!-- 스킬 속성 태그 -->
                                            <div class="skill-attributes" th:if="${skill.tooltip != null}">
                                                <span th:each="attr : ${skill.tooltip.extractSkillAttributes()}"
                                                      th:text="${attr}"
                                                      class="skill-attr-tag"></span>
                                            </div>
                                        </div>
                                        <p class="skill-level-text">Lv.<span th:text="${skill.level}"></span></p>
                                    </div>

                                    <!-- 룬 및 트라이포드, 보석 -->
                                    <div class="skill-extras">
                                        <!-- 보석 정보 -->
                                        <div class="skill-gems"
                                             th:if="${characterData.characterGems?.effects?.skills != null and characterData.characterGems?.gems != null}">
                                            <th:block th:each="gemSkill : ${characterData.characterGems.effects.skills}"
                                                      th:if="${gemSkill.name == skill.name}">
                                                <th:block th:each="actualGem : ${characterData.characterGems.gems}"
                                                          th:if="${actualGem.slot == gemSkill.gemSlot}">
                                                    <div class="gem-mini-display">
                                                        <div class="gem-icon-wrapper"
                                                             th:classappend="${actualGem.tooltip.getGemLevelClass(actualGem.level)}">
                                                            <img th:src="${actualGem.icon}"
                                                                 class="gem-mini-img"
                                                                 th:title="${actualGem.tooltip.getCleanedGemName() + ' : ' + gemSkill.option}"/>
                                                            <span th:text="${actualGem.level}" class="gem-mini-badge"></span>
                                                        </div>
                                                        <span th:text="${actualGem.tooltip.getSimplifiedGemName()}" class="gem-mini-name"></span>
                                                    </div>
                                                </th:block>
                                            </th:block>
                                        </div>

                                        <!-- 룬 정보 -->
                                        <div th:if="${skill.rune != null}" class="skill-rune">
                                            <img th:src="${skill.rune.icon}" th:title="${skill.rune.name}"
                                                 class="rune-icon-img"
                                                 th:classappend="'rune-border-' + ${skill.rune.grade}"/>
                                            <span th:text="${skill.rune.name}" class="rune-name"></span>
                                        </div>

                                        <!-- 트라이포드 -->
                                        <div class="skill-tripods">
                                            <th:block th:each="tripod : ${skill.tripods}" th:if="${tripod.isSelected}">
                                                <div class="tripod-wrapper">
                                                    <img th:src="${tripod.icon}" th:title="${tripod.name}" class="tripod-img"/>
                                                    <span th:text="${tripod.slot}" class="tripod-slot-badge"></span>
                                                </div>
                                            </th:block>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <!-- =========================================================
                         [탭 4] 아크 그리드 상세 탭
                         ========================================================= -->
                    <div id="ark-grid" class="tab-content" style="display: none;">
                        <div class="card" th:if="${characterData?.characterArkGrid != null}">
                            <div class="card-header">아크 그리드 상세</div>
                            <div class="arkGrid-list">
                                <div class="arkGrid-slot-box" th:each="slot : ${characterData.characterArkGrid.slots}">
                                    <div class="arkGrid-item">
                                        <!-- 슬롯 기본 정보 (아이콘 + 이름/등급) -->
                                        <div class="arkGrid-slot-main">
                                            <div class="arkGrid-icon-wrapper">
                                                <img th:src="${slot.icon}" th:alt="${slot.name}" class="arkGrid-img"/>
                                            </div>
                                            <div class="arkGrid-info">
                                                <div class="arkGrid-name-area">
                                                    <strong th:text="${slot.name}"></strong>
                                                    <p th:text="${slot.grade}" class="arkGrid-grade"></p>
                                                    <p th:text="'활성 포인트 : ' + (${slot.point} ?: 0)" class="arkGrid-point"></p>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- 슬롯 코어 효과 주석 처리 및 젬 정보 인라인 배치 -->
                                        <div class="arkGrid-extras">
                                            <!-- 기존 코어 효과 주석 처리
                                            <div class="core-effect-display" th:if="${slot.tooltip != null}">
                                                <div th:if="${#strings.contains(slot.name, '질서의')}"
                                                     class="ark-grid-tooltip"
                                                     th:attr="data-total-points=${slot.point}"
                                                     th:utext="${slot.tooltip.getNestedElementHtml('Element_006', 'Element_001')}"></div>
                                                <div th:if="${#strings.contains(slot.name, '혼돈의')}"
                                                     class="ark-grid-tooltip"
                                                     th:attr="data-total-points=${slot.point}"
                                                     th:utext="${slot.tooltip.getNestedElementHtml('Element_005', 'Element_001')}"></div>
                                            </div>
                                            -->

                                            <!-- 젬 정보 기본 노출 영역 -->
                                            <div class="arkGrid-gems-detail"
                                                 th:if="${slot.gems != null and !slot.gems.empty}">
                                                <div th:each="gem : ${slot.gems}" class="arkGrid-gem-item">
                                                    <div class="arkGrid-gem-info" th:if="${gem.tooltip != null}">
                                                        <img th:src="${gem.icon}" th:title="${gem.grade}"
                                                             class="arkGrid-gem-icon-img"/>
                                                        <div th:utext="${gem.tooltip.getElementHtml('Element_000')}"></div>

                                                        <div class="gem-effect-part"
                                                             th:each="part : ${gem.tooltip.getSimplifiedArkGridGemList('Element_005')}">
                                                            <span th:text="${part}"></span>
                                                        </div>
                                                        <div class="gem-effect-part"
                                                             th:each="part : ${gem.tooltip.getSimplifiedArkGridGemList('Element_006')}">
                                                            <span th:text="${part}"></span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- =========================================================
                         [탭 5] 아크 패시브 상세 탭
                         ========================================================= -->
                    <div id="ark-passive" class="tab-content" style="display: none;">
                        <div class="card" th:if="${characterData?.characterArkPassive != null}">
                            <div class="card-header">아크 패시브 상세</div>
                            <div class="ark-passive-wrapper">
                                <!-- 진화 컬럼 -->
                                <div class="ark-passive-column" id="evolution">
                                    <div class="ark-col-header">
                                        <h3>[진화]</h3>
                                        <p th:each="point : ${characterData.characterArkPassive.points}"
                                           th:if="${point.name == '진화'}" th:text="${point.description}"></p>
                                    </div>
                                    <div th:each="t : ${#strings.arraySplit('1,2,3,4,5', ',')}" class="ark-tier-section"
                                         th:attr="data-tier=${t}">
                                        <div th:each="effect : ${characterData.characterArkPassive.effects}"
                                             th:if="${effect.name == '진화' and effect.tier == t}"
                                             class="ark-passive-effect-item">
                                            <div class="effect-header">
                                                <img th:src="${effect.icon}" alt="Evolution Icon"/>
                                                <div class="ark-passive-tooltip" th:if="${effect.toolTip != null}">
                                                    <div class="tooltip-title"
                                                         th:utext="${effect.getCleanedToolTipHtml('Element_000')}"></div>
                                                    <div class="tooltip-description"
                                                         th:utext="${effect.getCleanedToolTipHtml('Element_002')}"></div>
                                                </div>
                                            </div>
                                            <div class="effect-info">
                                                <span class="effect-name text-ancient"
                                                      th:text="${effect.pureName}"></span>
                                                <span class="effect-level text-ancient"
                                                      th:text="${effect.pureLevel}"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- 깨달음 컬럼 -->
                                <div class="ark-passive-column" id="enlightenment">
                                    <div class="ark-col-header">
                                        <h3>[깨달음]</h3>
                                        <p th:each="point : ${characterData.characterArkPassive.points}"
                                           th:if="${point.name == '깨달음'}" th:text="${point.description}"></p>
                                    </div>
                                    <div th:each="t : ${#strings.arraySplit('1,2,3,4,5', ',')}" class="ark-tier-section"
                                         th:attr="data-tier=${t}">
                                        <div th:each="effect : ${characterData.characterArkPassive.effects}"
                                             th:if="${effect.name == '깨달음' and effect.tier == t}"
                                             class="ark-passive-effect-item">
                                            <div class="effect-header">
                                                <img th:src="${effect.icon}" alt="Enlightenment Icon"/>
                                                <div class="ark-passive-tooltip" th:if="${effect.toolTip != null}">
                                                    <div class="tooltip-title"
                                                         th:utext="${effect.getCleanedToolTipHtml('Element_000')}"></div>
                                                    <div class="tooltip-description"
                                                         th:utext="${effect.getCleanedToolTipHtml('Element_002')}"></div>
                                                </div>
                                            </div>
                                            <div class="effect-info">
                                                <span class="effect-name text-rare"
                                                      th:text="${effect.pureName}"></span>
                                                <span class="effect-level text-rare"
                                                      th:text="${effect.pureLevel}"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- 도약 컬럼 -->
                                <div class="ark-passive-column" id="leap">
                                    <div class="ark-col-header">
                                        <h3>[도약]</h3>
                                        <p th:each="point : ${characterData.characterArkPassive.points}"
                                           th:if="${point.name == '도약'}" th:text="${point.description}"></p>
                                    </div>
                                    <div th:each="t : ${#strings.arraySplit('1,2,3,4,5', ',')}" class="ark-tier-section"
                                         th:attr="data-tier=${t}">
                                        <div th:each="effect : ${characterData.characterArkPassive.effects}"
                                             th:if="${effect.name == '도약' and effect.tier == t}"
                                             class="ark-passive-effect-item">
                                            <div class="effect-header">
                                                <img th:src="${effect.icon}" alt="Leap Icon"/>
                                                <div class="ark-passive-tooltip" th:if="${effect.toolTip != null}">
                                                    <div class="tooltip-title"
                                                         th:utext="${effect.getCleanedToolTipHtml('Element_000')}"></div>
                                                    <div class="tooltip-description"
                                                         th:utext="${effect.getCleanedToolTipHtml('Element_002')}"></div>
                                                </div>
                                            </div>
                                            <div class="effect-info">
                                                <span class="effect-name" style="color: #c2ea55;"
                                                      th:text="${effect.pureName}"></span>
                                                <span class="effect-level" style="color: #c2ea55;"
                                                      th:text="${effect.pureLevel}"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- =========================================================
                         [탭 6] 원정대 탭 (비동기 로딩)
                         ========================================================= -->
                    <div id="expedition" class="tab-content" style="display: none;"
                         th:data-character-name="${characterData?.characterProfiles != null ? characterData.characterProfiles.characterName : ''}">
                        <div class="card expedition-card-wrap">
                            <div class="card-header">원정대 캐릭터 목록</div>
                            <div id="expedition-loading" class="loading-container">
                                <div class="spinner"></div>
                                <p>원정대 정보를 불러오는 중입니다...</p>
                            </div>
                            <div id="expedition-container" class="expedition-container" style="display: none;">
                                <!-- 비동기로 로드된 데이터가 여기에 삽입됨 -->
                            </div>
                            <div id="expedition-error" class="no-data" style="display: none;">
                                <p>원정대 정보를 불러오는 데 실패했습니다.</p>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </th:block>

    <th:block th:fragment="pageScript">
        <script type="module" src="/js/character/searchCharacter.js"></script>
    </th:block>
</div>
</body>
</html>
