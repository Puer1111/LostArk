<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lost Ark Character Details</title>
</head>
<body>
<div th:replace="~{layout/layout :: layout(
        css = ~{::pageCss},
        content = ~{::mainContent},
        script = ~{::pageScript}
    )}">
    <th:block th:fragment="pageCss">
        <link rel="stylesheet" href="/css/character/searchCharacter.css">
    </th:block>
    <th:block th:fragment="mainContent">
        <div class="container">
            <div class="layout-wrapper">
                <div class="left-column">
                    <!-- Character Profiles (Content Area) -->
                    <div class="section profiles" th:if="${characterData.characterProfiles != null}">
                        <!-- 프로필 상단 플렉스 영역 (아바타 이미지 + 기본 정보) -->
                        <div class="profile-top-flex">
                            <!-- 작고 동그란 캐릭터 아바타 이미지 -->
                            <div class="profile-avatar"
                                 th:if="${characterData.characterProfiles.characterImage != null and !characterData.characterProfiles.characterImage.isEmpty()}"
                                 th:style="'background-image: url(\'' + ${characterData.characterProfiles.characterImage} + '\');'">
                            </div>

                            <!-- 프로필 상단 이름 및 레벨 영역 -->
                            <div class="profile-header-new">
                                <div class="profile-name-row">
                                    <span class="profile-name-new"
                                          th:text="${characterData.characterProfiles.characterName}"></span>
                                    <span class="profile-level-badge"
                                          th:text="'Lv.' + ${characterData.characterProfiles.characterLevel}"></span>
                                </div>
                                <div class="profile-class-new"
                                     th:text="${characterData.characterProfiles.characterClassName}"></div>
                            </div>
                        </div>

                        <!-- 2x2 상세 정보 그리드 -->
                        <div class="profile-grid-new">
                            <div class="profile-grid-item">
                                <span class="grid-item-label">서버</span>
                                <strong class="grid-item-value"
                                        th:text="${characterData.characterProfiles.serverName}"></strong>
                            </div>
                            <div class="profile-grid-item">
                                <span class="grid-item-label">전투력</span>
                                <strong class="grid-item-value"
                                        th:text="${characterData.characterProfiles.CombatPower}"></strong>
                            </div>
                            <div class="profile-grid-item">
                                <span class="grid-item-label">아이템 레벨</span>
                                <strong class="grid-item-value"
                                        th:text="${characterData.characterProfiles.itemAvgLevel}"></strong>
                            </div>
                            <div class="profile-grid-item">
                                <span class="grid-item-label">길드</span>
                                <strong class="grid-item-value"
                                        th:text="${characterData.characterProfiles.guildName != null and !characterData.characterProfiles.guildName.isEmpty()} ? ${characterData.characterProfiles.guildName} : '-'"></strong>
                            </div>
                        </div>
                    </div>

                    <!-- Engravings -->
                    <div class="section Engravings">
                        <h2>각인 효과</h2>
                        <div class="engraving-container">
                            <div class="engraving-item"
                                 th:each="effect : ${characterData.characterEngravings.arkPassiveEffects}">
                                <div class="engraving-details" th:if="${effect.grade != null}">
                                    <div>
                                        <div class="engraving-item-content"
                                             th:data-grade="${effect.grade}" th:data-level="${effect.level}">
                                            <span class="engraving-name" th:text="${effect.name}"></span>
                                            <div class="engraving-info-group">
                                                <em class="engraving-icon" th:data-engraving-name="${effect.name}"></em>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="right-column">
                    <!-- Tabs Menu -->
                    <div class="info-tabs">
                        <button type="button" class="tab-btn active" data-target="equipment">장비</button>
                        <button type="button" class="tab-btn" data-target="skills">스킬</button>
                        <button type="button" class="tab-btn" data-target="ark-grid">아크 그리드</button>
                        <button type="button" class="tab-btn" data-target="ark-passive">아크 패시브</button>
                        <button type="button" class="tab-btn" data-target="expedition">원정대</button>
                    </div>

                    <!-- 1. 장비 탭 (기본 노출) -->
                    <div id="equipment" class="tab-content" style="display: block;">
                        <!-- Character Equipment -->
                        <div class="section equipment"
                             th:if="${characterData.characterEquipment != null and !characterData.characterEquipment.empty}">
                            <div class="equipment-columns">
                                <!-- Left Column: Armor (6 items) -->
                                <div class="equipment-left">
                                    <ul class="equipment-list">
                                        <li class="equipment-item" th:each="item : ${characterData.characterEquipment}"
                                            th:if="${item.type == '무기' or item.type == '투구' or item.type == '어깨' or item.type == '상의' or item.type == '하의' or item.type == '장갑'}">
                                            <div class="tooltip-content">
                                                <div class="equipment-area">
                                                    <div class="item-img">
                                                        <img th:src="${item.icon}" alt="아이템 아이콘"/>
                                                    </div>
                                                    <div class="item-description">
                                                        <span th:text="${item.name}"></span>
                                                        <th:block
                                                                th:if="${!item.tooltip.getAdvancedHoningLevel().isEmpty()}">
                                                            <span th:text="'+' + ${item.tooltip.getAdvancedHoningLevel()}"></span>
                                                        </th:block>
                                                    </div>
                                                </div>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                                <!-- Right Column: Accessories (7 items) -->
                                <div class="equipment-right">
                                    <ul class="accessory-list">
                                        <li class="accessory-item" th:each="item : ${characterData.characterEquipment}"
                                            th:if="${item.type == '목걸이' or item.type == '귀걸이' or item.type == '반지' or item.type == '팔찌' or item.type == '어빌리티 스톤'}">
                                            <div class="tooltip-content" th:if="${item.tooltip != null}">
                                                <div class="equipment-area">
                                                    <div class="item-img">
                                                        <img th:src="${item.icon}" alt="아이템 아이콘"/>
                                                    </div>
                                                    <div th:utext="${item.tooltip.getElementHtml('Element_005')}"></div>
                                                    <th:block
                                                            th:if="${item.type == '목걸이' or item.type == '귀걸이' or item.type == '반지'}">
                                                        <div th:utext="${item.tooltip.getNestedElementHtml('Element_006', 'Element_001')}"></div>
                                                    </th:block>
                                                    <div th:utext="${item.tooltip.extractEngravings()}"></div>
                                                </div>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </div>

                            <!-- Gems Item Container (Statically under equipment) -->
                            <div class="gems-item-container" th:if="${characterData.characterGems.gems != null}"
                                 style="border-top: 1px solid #eaeaea; padding-top: 15px; margin-top: 15px;">
                                <div class="gems-item-content"
                                     style="display:flex; flex-wrap: wrap; gap: 10px; margin-bottom: 0;">
                                    <div class="gem-wrapper" th:each="item : ${characterData.characterGems.gems}">
                                        <div class="item-img">
                                            <img alt="Gem Icon" th:src="${item.icon}" class="gem-img"/>
                                        </div>
                                        <div class="gem-tooltip-details" th:if="${item.tooltip != null}"
                                             th:with="filteredTips=${item.tooltip.getFilteredGemsTooltip()}">
                                            <div th:if="${!filteredTips.empty}" class="gem-tooltip-content">
                                                <strong th:text="${item.tooltip.getCleanedGemName()}"
                                                        style="color: #A9D0F5;"></strong>
                                                <ul>
                                                    <li th:each="tip : ${filteredTips}" th:text="${tip}"></li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Ark Passive & Ark Grid Simplified Previews Row (Visible inside the Equipment tab) -->
                        <div class="ark-bottom-row">
                            <!-- Ark Passive Simple Box -->
                            <div class="section arkPassive-simple" th:if="${characterData.characterArkPassive != null}"
                                 style="flex: 1; margin-bottom: 0; cursor: pointer;"
                                 onclick="document.querySelector('[data-target=\'ark-passive\']').click();">
                                <h3>[아크 패시브]</h3>
                                <div th:if="${characterData.characterArkPassive.points != null and !characterData.characterArkPassive.points.empty}"
                                     style="display: flex; flex-direction: column; gap: 12px;">
                                    <div th:each="point : ${characterData.characterArkPassive.points}"
                                         class="arkPassive-simple-container"
                                         style="display: flex; flex-direction: column; gap: 6px;">
                                        <!-- 대분류 명칭 (진화, 깨달음, 도약) -->
                                        <div style="border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 2px;">
                                            <span th:text="'[' + ${point.name} + ']'"
                                                  style="color: #ffd700; font-weight: bold; font-size: 1.1em;"></span>
                                        </div>
                                        <!-- 세로형(column) 리스트 출력 -->
                                        <div class="arkPassive-simple-effects"
                                             style="display: flex; flex-direction: column; gap: 6px; padding-left: 6px;">
                                            <div th:each="effect : ${characterData.characterArkPassive.effects}"
                                                 th:if="${effect.name == point.name}"
                                                 style="display: flex; justify-content: space-between; align-items: center; font-size: 0.95em;">
                                                <span style="display: inline-flex; align-items: center; gap: 6px;">
                                                    <img th:if="${effect.icon != null and !effect.icon.isEmpty()}"
                                                         th:src="${effect.icon}"
                                                         alt="Effect Icon"
                                                         style="width: 16px; height: 16px; border-radius: 3px; background: rgba(0,0,0,0.5);"/>
                                                    <span th:text="${effect.pureName}" style=""></span>
                                                </span>
                                                <span th:text="${effect.pureLevel}" style="font-weight: bold;"></span>
                                            </div>
                                        </div>
                                    </div>
                                    <div style="text-align: right; margin-top: 8px;">
                                        <span style="font-size: 0.8em; color: #4a90e2; font-weight: bold;">[ 상세보기 > ]</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Ark Grid Simple Box -->
                            <div class="section arkGrid-simple" th:if="${characterData.characterArkGrid != null}"
                                 style="flex: 1; margin-bottom: 0; cursor: pointer;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                    <h3 style="margin: 0;">[아크 그리드]</h3>
                                </div>
                                <div id="arkGrid-simple-container"
                                     th:if="${characterData.characterArkGrid.slots != null and !characterData.characterArkGrid.slots.empty}">
                                    <!-- 세로형(column) 리스트 출력 -->
                                    <div class="arkGrid-simple-list"
                                         style="display: flex; flex-direction: column; gap: 6px; padding-left: 6px;">
                                        <div class="arkGrid-simple-item"
                                             th:each="slot : ${characterData.characterArkGrid.slots}"
                                             style="display: flex; justify-content: space-between; align-items: center; font-size: 0.95em; width: 100%;">
                                            <span style="display: inline-flex; align-items: center; gap: 6px;">
                                                <img th:src="${slot.icon}" alt="슬롯 아이콘" class="arkGrid-img"
                                                     style="width: 16px; height: 16px; border-radius: 3px; background: rgba(0,0,0,0.3); border: 1px solid #555;"/>
                                                <span th:text="${slot.name}"></span>
                                            </span>
                                            <span th:text="${slot.point} + 'P'"
                                                  style="color: #ccc; font-weight: bold;"></span>
                                        </div>
                                    </div>
                                    <div style="text-align: right; margin-top: 14px;">
                                        <span style="font-size: 0.8em; color: #4a90e2; font-weight: bold;"></span>
                                    </div>
                                </div>
                                <div id="arkGrid-gems-simple-container"
                                     th:with="combinedGems=${characterData.characterArkGrid.getAllCombinedGemEffects()}"
                                     style="border-top: 1px solid rgba(255, 255, 255, 0.1); margin-top: 12px; padding-top: 10px;">
                                    <div th:if="${combinedGems != null and !combinedGems.empty}">
                                        <div style="margin-bottom: 6px;">
                                            <span style="color: #ffd700; font-weight: bold; font-size: 0.95em;">[효과]</span>
                                        </div>
                                        <div style="display: flex; flex-direction: column; gap: 4px; padding-left: 6px;">
                                            <div th:each="effectStr : ${combinedGems}"
                                                 style="display: flex; justify-content: space-between; align-items: center; font-size: 0.85em;">
                                                <!-- [효과이름] Lv.X 형태로 노출 -->
                                                <span th:text="${effectStr}"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 2. 스킬 탭 -->
                    <div id="skills" class="tab-content" style="display: none;">
                        <div class="section skills">
                            <h2>전투 스킬</h2>
                            <ul class="skill-list"
                                style="display: flex; flex-direction: column; gap: 10px; list-style: none; padding: 0;">
                                <li th:each="skill : ${characterData.characterCombatSkill}" th:if="${skill.level > 1}"
                                    class="skill-item"
                                    style="display: flex; align-items: center; background: rgba(0,0,0,0.3); padding: 10px 15px; border-radius: 8px; gap: 15px;">
                                    <!-- 스킬 기본 정보 (왼쪽) -->
                                    <img th:src="${skill.icon}" alt="Skill Icon"
                                         style="width: 40px; height: 40px; border-radius: 4px;"/>
                                    <div class="skill-info">
                                        <div class="skill-name-area"
                                             style="display: flex; align-items: center; gap: 10px;">
                                            <strong th:text="${skill.name}"
                                                    style="font-size: 1.1em; color: #fff;"></strong>
                                            <!-- 스킬 속성 (무력화, 부위파괴, 면역) 표시 -->
                                            <div class="skill-attributes" th:if="${skill.tooltip != null}"
                                                 style="display: flex; gap: 5px;">
                                                <span th:each="attr : ${skill.tooltip.extractSkillAttributes()}"
                                                      th:text="${attr}"
                                                      style="font-size: 0.75em; background: rgba(255,255,255,0.15); color: #FFD700; padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(255,215,0,0.3); white-space: nowrap;">
                                                </span>
                                            </div>
                                        </div>
                                        <p style="margin: 0; font-size: 0.9em; color: #ccc;">Lv.<span
                                                th:text="${skill.level}"></span></p>
                                    </div>

                                    <!-- 룬 및 트라이포드 (오른쪽 정렬) -->
                                    <div class="skill-extras"
                                         style="margin-left: auto; display: flex; align-items: center; gap: 20px;">
                                        <!-- 보석 정보 (진짜 보석 아이콘 및 이름 표시) -->
                                        <div class="skill-gems"
                                             th:if="${characterData.characterGems != null and characterData.characterGems.gems != null}"
                                             style="display: flex; gap: 8px;">
                                            <th:block th:each="gemSkill : ${characterData.characterGems.effects.skills}"
                                                      th:if="${gemSkill.name == skill.name}">
                                                <!-- gemSkill.gemSlot과 일치하는 실제 보석(Gem)을 찾아서 출력 -->
                                                <th:block th:each="actualGem : ${characterData.characterGems.gems}"
                                                          th:if="${actualGem.slot == gemSkill.gemSlot}">
                                                    <div class="gem-mini-display"
                                                         style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
                                                        <div class="gem-icon-wrapper"
                                                             th:classappend="${actualGem.tooltip.getGemLevelClass(actualGem.level)}"
                                                             style="position: relative; display: inline-block;">
                                                            <img th:src="${actualGem.icon}"
                                                                 style="width: 30px; height: 30px; border-radius: 4px; background: rgba(0,0,0,0.5); display: block;"
                                                                 th:title="${actualGem.tooltip.getCleanedGemName() + ' : ' + gemSkill.option}"/>
                                                            <span th:text="${actualGem.level}"
                                                                  style="position: absolute; bottom: -2px; right: -2px; background: rgba(0,0,0,0.8); color: #fff; font-size: 0.65em; font-weight: bold; padding: 0 3px; border-radius: 3px; line-height: 1.2; text-shadow: 1px 1px 1px #000;"></span>
                                                        </div>
                                                        <span th:text="${actualGem.tooltip.getSimplifiedGemName()}"
                                                              style="font-size: 0.6em; color: #A9D0F5; white-space: nowrap; max-width: 50px; overflow: hidden; text-overflow: ellipsis; text-align: center;"></span>
                                                    </div>
                                                </th:block>
                                            </th:block>
                                        </div>

                                        <!-- 룬 정보 -->
                                        <div th:if="${skill.rune != null}" class="skill-rune"
                                             style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 50px;">
                                            <img th:src="${skill.rune.icon}" th:title="${skill.rune.name}"
                                                 class="rune-icon-img"
                                                 th:classappend="'rune-border-' + ${skill.rune.grade}"/>
                                            <span th:text="${skill.rune.name}"
                                                  style="font-size: 0.75em;white-space: nowrap; text-align: center;"></span>
                                        </div>

                                        <!-- 트라이포드 -->
                                        <div class="skill-tripods" style="display: flex; gap: 8px; min-width: 108px;">
                                            <th:block th:each="tripod : ${skill.tripods}" th:if="${tripod.isSelected}">
                                                <div class="tripod-wrapper"
                                                     style="position: relative; display: inline-block;">
                                                    <img th:src="${tripod.icon}" th:title="${tripod.name}"
                                                         style="width: 28px; height: 28px; border-radius: 50%; border: 1px solid #555; display: block;"/>
                                                    <span th:text="${tripod.slot}"
                                                          style="position: absolute; bottom: -2px; right: -2px; background: rgba(0,0,0,0.8); color: #FFD700; font-size: 0.65em; font-weight: bold; padding: 0 3px; border-radius: 3px; line-height: 1.2; text-shadow: 1px 1px 1px #000;"></span>
                                                </div>
                                            </th:block>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <!-- 3. 아크 그리드 탭 -->
                    <div id="ark-grid" class="tab-content" style="display: none;">
                        <div class="section arkGrid" th:if="${characterData.characterArkGrid != null}">
                            <div class="arkGrid-list">
                                <div class="arkGrid-slot-box" th:each="slot : ${characterData.characterArkGrid.slots}">
                                    <div class="arkGrid-item">
                                        <div class="arkGrid-icon-wrapper">
                                            <img th:src="${slot.icon}" th:alt="${slot.name}" class="arkGrid-img"/>
                                        </div>
                                        <div class="arkGrid-info">
                                            <div class="arkGrid-name-area">
                                                <strong th:text="${slot.name}"></strong>
                                            </div>
                                            <p th:text="${slot.grade}" class="arkGrid-grade"></p>
                                        </div>
                                        <!-- 상세보기 화살표 (우측 하단 고정) -->
                                        <button class="arkGrid-detail-btn" type="button">
                                            <span class="arrow" style="font-size:small;">∨ 잼 상세보기</span>
                                        </button>

                                        <!-- 슬롯 코어 효과 (즉시 노출) -->
                                        <div class="arkGrid-extras" th:if="${slot.tooltip != null}">
                                            <div class="core-effect-display">
                                                <div th:if="${#strings.contains(slot.name, '질서의')}"
                                                     class="ark-grid-tooltip"
                                                     th:attr="data-total-points=${slot.point}"
                                                     th:utext="${slot.tooltip.getNestedElementHtml('Element_006', 'Element_001')}"></div>
                                                <div th:if="${#strings.contains(slot.name, '혼돈의')}"
                                                     class="ark-grid-tooltip"
                                                     th:attr="data-total-points=${slot.point}"
                                                     th:utext="${slot.tooltip.getNestedElementHtml('Element_005', 'Element_001')}"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- 상세보기 패널 (기본 숨김) -->
                                    <div class="arkGrid-detail-panel" style="display: none;">
                                        <div class="arkGrid-gems-detail"
                                             th:if="${slot.gems != null and !slot.gems.empty}">
                                            <div th:each="gem : ${slot.gems}" class="arkGrid-gem-item">
                                                <div class="arkGrid-gem-info" th:if="${gem.tooltip != null}">
                                                    <img th:src="${gem.icon}" th:title="${gem.grade}"
                                                         class="arkGrid-gem-icon-img"/>
                                                    <div th:utext="${gem.tooltip.getElementHtml('Element_000')}"></div>

                                                    <div class="gem-effect-part"
                                                         th:each="part : ${gem.tooltip.getSimplifiedArkGridGemList('Element_005')}">
                                                        <span th:text="${part}"></span>
                                                    </div>
                                                    <div class="gem-effect-part"
                                                         th:each="part : ${gem.tooltip.getSimplifiedArkGridGemList('Element_006')}">
                                                        <span th:text="${part}"></span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 4. 아크 패시브 탭 -->
                    <div id="ark-passive" class="tab-content" style="display: none;">
                        <div class="section arkPassive" th:if="${characterData.characterArkPassive != null}">
                            <div class="ark-passive-wrapper" style="display: flex; gap: 20px;">
                                <!-- 진화 (Evolution) 컬럼 -->
                                <div class="ark-passive-column" id="evolution">
                                    <h3>[진화] <p th:each="point : ${characterData.characterArkPassive.points}"
                                                th:if="${point.name == '진화'}" th:text="${point.description}"
                                                style="font-size: 0.9em; margin-bottom: 10px;"></p>
                                    </h3>
                                    <div th:each="t : ${#strings.arraySplit('1,2,3,4,5', ',')}" class="ark-tier-section"
                                         th:attr="data-tier=${t}">
                                        <div th:each="effect : ${characterData.characterArkPassive.effects}"
                                             th:if="${effect.name == '진화' and effect.tier == t}"
                                             class="ark-passive-effect-item">
                                            <div class="effect-header">
                                                <img th:src="${effect.icon}" alt="Evolution Icon"
                                                     style="width: 32px; height: 32px;"/>
                                                <div class="ark-passive-tooltip" th:if="${effect.toolTip != null}">
                                                    <div class="tooltip-title"
                                                         th:utext="${effect.getCleanedToolTipHtml('Element_000')}"></div>
                                                    <div class="tooltip-description"
                                                         th:utext="${effect.getCleanedToolTipHtml('Element_002')}"></div>
                                                </div>
                                            </div>
                                            <div class="effect-info">
                                                <font color="#F1D594" class="effect-name"
                                                      th:text="${effect.pureName}"></font>
                                                <font color="#F1D594" class="effect-level"
                                                      th:text="${effect.pureLevel}"></font>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- 깨달음 (Enlightenment) 컬럼 -->
                                <div class="ark-passive-column" id="enlightenment">
                                    <h3>[깨달음] <p th:each="point : ${characterData.characterArkPassive.points}"
                                                 th:if="${point.name == '진화'}" th:text="${point.description}"
                                                 style="font-size: 0.9em; margin-bottom: 10px;"></p>
                                    </h3>
                                    <div th:each="t : ${#strings.arraySplit('1,2,3,4,5', ',')}" class="ark-tier-section"
                                         th:attr="data-tier=${t}">
                                        <div th:each="effect : ${characterData.characterArkPassive.effects}"
                                             th:if="${effect.name == '깨달음' and effect.tier == t}"
                                             class="ark-passive-effect-item">
                                            <div class="effect-header">
                                                <img th:src="${effect.icon}" alt="Enlightenment Icon"
                                                     style="width: 32px; height: 32px;"/>
                                                <div class="ark-passive-tooltip" th:if="${effect.toolTip != null}">
                                                    <div class="tooltip-title"
                                                         th:utext="${effect.getCleanedToolTipHtml('Element_000')}"></div>
                                                    <div class="tooltip-description"
                                                         th:utext="${effect.getCleanedToolTipHtml('Element_002')}"></div>
                                                </div>
                                            </div>
                                            <div class="effect-info">
                                                <font color="#83E9FF" class="effect-name"
                                                      th:text="${effect.pureName}"></font>
                                                <font color="#83E9FF" class="effect-level"
                                                      th:text="${effect.pureLevel}"></font>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- 도약 (Leap) 컬럼 -->
                                <div class="ark-passive-column" id="leap">
                                    <h3>[도약] <p th:each="point : ${characterData.characterArkPassive.points}"
                                                th:if="${point.name == '진화'}" th:text="${point.description}"
                                                style="font-size: 0.9em; margin-bottom: 10px;"></p>
                                    </h3>
                                    <div th:each="t : ${#strings.arraySplit('1,2,3,4,5', ',')}" class="ark-tier-section"
                                         th:attr="data-tier=${t}">
                                        <div th:each="effect : ${characterData.characterArkPassive.effects}"
                                             th:if="${effect.name == '도약' and effect.tier == t}"
                                             class="ark-passive-effect-item">
                                            <div class="effect-header">
                                                <img th:src="${effect.icon}" alt="Leap Icon"
                                                     style="width: 32px; height: 32px;"/>
                                                <div class="ark-passive-tooltip" th:if="${effect.toolTip != null}">
                                                    <div class="tooltip-title"
                                                         th:utext="${effect.getCleanedToolTipHtml('Element_000')}"></div>
                                                    <div class="tooltip-description"
                                                         th:utext="${effect.getCleanedToolTipHtml('Element_002')}"></div>
                                                </div>
                                            </div>
                                            <div class="effect-info">
                                                <font color="#C2EA55" class="effect-name"
                                                      th:text="${effect.pureName}"></font>
                                                <font color="#C2EA55" class="effect-level"
                                                      th:text="${effect.pureLevel}"></font>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 5. 원정대 탭 -->
                    <div id="expedition" class="tab-content" style="display: none;"
                         th:data-character-name="${characterData.characterProfiles.characterName}">
                        <div class="section expedition">
                            <div id="expedition-loading" class="loading-container">
                                <div class="spinner"></div>
                                <p>원정대 정보를 불러오는 중입니다...</p>
                            </div>
                            <div id="expedition-container" class="expedition-container" style="display: none;">
                                <!-- 비동기로 로드된 데이터가 여기에 삽입됨 -->
                            </div>
                            <div id="expedition-error" class="no-data" style="display: none;">
                                <p>원정대 정보를 불러오는 데 실패했습니다.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
    <th:block th:fragment="pageScript">
        <script type="module" src="/js/character/searchCharacter.js"></script>
    </th:block>
</div>
</body>
</html>
