<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LoaHub</title>
</head>
<body>
    <div th:replace="~{layout/layout :: layout(
        css = ~{::pageCss},
        content = ~{::mainContent},
        script = ~{::pageScript}
    )}">
    <th:block th:fragment="pageCss">
        <link rel="stylesheet" href="/css/index.css">
    </th:block>
    <th:block th:fragment="mainContent">
        <div class="main-content">
            <!-- 오늘의 주요 일정 섹션 -->
            <section class="events-section">
<!--                <h2 class="section-title">오늘의 주요 일정</h2>-->
                
                <div th:if="${eventsMap != null and !eventsMap.isEmpty()}" class="calendar-container">
                    <!-- 카테고리별 카드 (Map iteration) -->
                    <div th:each="entry : ${eventsMap}" class="calendar-card event-group-card">
                        <div class="calendar-header">
                            <span class="category-tag" th:text="${entry.key}">카테고리명</span>
                        </div>
                        <div class="calendar-body">
                            <div th:each="item : ${entry.value}" class="island-group">
                                <div class="island-info-main" th:data-start-times="${#strings.listJoin(item.startTimes, ',')}">
                                    <div class="content-icon">
                                        <img th:src="${item.contentsIcon}" th:alt="${item.contentsName}">
                                    </div>
                                    <div class="content-info">
                                        <h3 th:text="${item.contentsName}">콘텐츠 이름</h3>
                                        <div class="timer-display">남은시간 계산 중...</div>
                                    </div>
                                </div>
                                <!-- 보상 아이템 -->
                                <div class="reward-container">
                                    <div th:each="rewardLevel : ${item.rewardItems}" class="reward-level">
                                        <div th:each="reward : ${rewardLevel.items}" class="reward-item" th:title="${reward.name}">
                                            <div class="reward-icon-wrapper">
                                                <img th:src="${reward.icon}" th:alt="${reward.name}" th:classappend="${'grade-' + reward.grade}">
                                            </div>
                                            <span class="reward-name" th:text="${reward.name}">아이템 이름</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${eventsMap == null or eventsMap.isEmpty()}" class="no-data">
                    오늘 예정된 특별 일정이 없습니다.
                </div>
            </section>

            <!-- 공지사항 및 이벤트 섹션 -->
            <div class="news-and-events-container">
                <!-- 공지사항 섹션 -->
                <section class="news-section">
                    <h2 class="section-title">공지사항</h2>
                    <div class="news-list" th:if="${notices != null and !notices.isEmpty()}">
                        <a th:each="notice : ${notices}" th:href="${notice.link}" target="_blank" class="news-item-link">
                            <div class="news-item">
                                <span class="news-type-tag" th:text="${notice.type}">[점검]</span>
                                <span class="news-title" th:text="${notice.title}">공지 제목</span>
                                <span class="news-date" th:text="${#temporals.format(notice.date, 'yyyy-MM-dd')}">2026-07-14</span>
                            </div>
                        </a>
                    </div>
                    <div th:if="${notices == null or notices.isEmpty()}" class="no-data">
                        등록된 공지사항이 없습니다.
                    </div>
                </section>

                <!-- 이벤트 섹션 -->
                <section class="events-list-section">
                    <h2 class="section-title">진행중인 이벤트</h2>
                    <div class="events-grid" th:if="${events != null and !events.isEmpty()}">
                        <a th:each="event : ${events}" th:href="${event.link}" target="_blank" class="event-card-link">
                            <div class="event-card">
                                <div class="event-thumbnail">
                                    <img th:src="${event.thumbnail}" th:alt="${event.title}">
                                </div>
                                <div class="event-info">
                                    <h4 class="event-title" th:text="${event.title}">이벤트 제목</h4>
                                    <p class="event-duration">
                                        <span th:text="${#temporals.format(event.startDate, 'yyyy-MM-dd')}">시작일</span>
                                        ~
                                        <span th:text="${#temporals.format(event.endDate, 'yyyy-MM-dd')}">종료일</span>
                                    </p>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div th:if="${events == null or events.isEmpty()}" class="no-data">
                        진행 중인 이벤트를 찾을 수 없습니다.
                    </div>
                </section>
            </div>

            <!-- 치지직 실시간 로스트아크 방송 섹션 -->
            <section class="chzzk-section">
                <h2 class="section-title">치지직 실시간 방송</h2>
                <div class="chzzk-container">
                    <div th:if="${chzzkLives != null and !chzzkLives.isEmpty()}" class="chzzk-list">
                        <a th:each="live : ${chzzkLives}" th:href="@{'https://chzzk.naver.com/live/' + ${live.channel.channelId}}" target="_blank" class="chzzk-card-link">
                            <div class="chzzk-card">
                                <div class="chzzk-thumbnail-wrapper">
                                    <img th:src="${live.getFormattedImageUrl()}" th:alt="${live.liveTitle}" class="chzzk-thumbnail">
                                    <span class="chzzk-viewer-badge">
                                        <span class="chzzk-dot">●</span>
                                        <span th:text="${#numbers.formatInteger(live.concurrentUserCount, 0, 'COMMA')} + '명'">0명</span>
                                    </span>
                                </div>
                                <div class="chzzk-info">
                                    <div class="chzzk-streamer">
                                        <img th:src="${live.channel.channelImageUrl}" th:alt="${live.channel.channelName}" class="chzzk-profile-img">
                                        <span class="chzzk-name" th:text="${live.channel.channelName}">스트리머 이름</span>
                                    </div>
                                    <div class="chzzk-title" th:text="${live.liveTitle}">방송 제목</div>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div th:if="${chzzkLives == null or chzzkLives.isEmpty()}" class="no-data">
                        현재 치지직에 생방송 중인 로스트아크 채널이 없습니다.
                    </div>
                </div>
            </section>
        </div>
    </th:block>
    <th:block th:fragment="pageScript">
        <script defer src="/js/index.js"></script>
    </th:block>
</div>
</body>
</html>
