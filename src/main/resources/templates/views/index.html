<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LoaHub</title>
</head>
<body>
    <div th:replace="~{layout/layout :: layout(
        css = ~{::pageCss},
        content = ~{::mainContent},
        script = ~{::pageScript}
    )}">
    <th:block th:fragment="pageCss">
        <link rel="stylesheet" href="/css/index.css">
    </th:block>
    <th:block th:fragment="mainContent">
        <div class="main-content">
            <!-- 오늘의 주요 일정 섹션 -->
            <section class="events-section">
                <h2 class="section-title">오늘의 주요 일정</h2>
                
                <div th:if="${eventsMap != null and !eventsMap.isEmpty()}" class="calendar-container">
                    <!-- 카테고리별 카드 (Map iteration) -->
                    <div th:each="entry : ${eventsMap}" class="calendar-card event-group-card">
                        <div class="calendar-header">
                            <span class="category-tag" th:text="${entry.key}">카테고리명</span>
                        </div>
                        <div class="calendar-body">
                            <div th:each="item : ${entry.value}" class="island-group">
                                <div class="island-info-main">
                                    <div class="content-icon">
                                        <img th:src="${item.contentsIcon}" th:alt="${item.contentsName}">
                                    </div>
                                    <div class="content-info">
                                        <h3 th:text="${item.contentsName}">콘텐츠 이름</h3>
                                    </div>
                                </div>
                                <!-- 보상 아이템 -->
                                <div class="reward-container">
                                    <div th:each="rewardLevel : ${item.rewardItems}" class="reward-level">
                                        <div th:each="reward : ${rewardLevel.items}" class="reward-item" th:title="${reward.name}">
                                            <div class="reward-icon-wrapper">
                                                <img th:src="${reward.icon}" th:alt="${reward.name}" th:classappend="${'grade-' + reward.grade}">
                                            </div>
                                            <span class="reward-name" th:text="${reward.name}">아이템 이름</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${eventsMap == null or eventsMap.isEmpty()}" class="no-data">
                    오늘 예정된 특별 일정이 없습니다.
                </div>
            </section>

            <!-- 전투력 Top 10 랭킹 섹션 -->
            <section class="ranking-section">
                <h2 class="section-title">전투력 Top 10</h2>
                <div class="ranking-container">
                    <div th:if="${topRankings != null and !topRankings.isEmpty()}" class="ranking-list">
                        <div th:each="ranker, stat : ${topRankings}" class="ranking-card">
                            <div class="rank-badge" th:text="${stat.count}">1</div>
                            <div class="ranker-info">
                                <div class="ranker-image">
                                    <img th:src="${ranker.characterImage}" th:alt="${ranker.characterName}">
                                </div>
                                <div class="ranker-details">
                                    <div class="ranker-name">
                                        <a th:href="@{'/character/' + ${ranker.characterName}}" th:text="${ranker.characterName}">닉네임</a>
                                    </div>
                                    <div class="ranker-class" th:text="${ranker.characterClassName}">클래스</div>
                                    <div class="ranker-power">
                                        <span class="label">전투력</span>
                                        <span class="value" th:text="${ranker.combatPower}">0</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div th:if="${topRankings == null or topRankings.isEmpty()}" class="no-data">
                        수집된 랭킹 정보가 없습니다. 캐릭터를 검색해 보세요!
                    </div>
                </div>
            </section>
        </div>
    </th:block>
    <th:block th:fragment="pageScript">
    </th:block>
</div>
</body>
</html>
