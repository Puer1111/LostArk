<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/users/signup.css}">
</head>
<body>
    <div class="form-container">
        <div class="signup-card">
            <h2 class="text-center mb-4">회원가입</h2>
            <form th:action="@{/users/signup}" method="post">
                <div class="mb-3">
                    <label for="userId" class="form-label">아이디</label>
                    <input type="text" class="form-control" id="userId" name="userId" placeholder="사용할 아이디를 입력하세요" required>
                </div>
                <div class="mb-3">
                    <label for="userPassword" class="form-label">비밀번호</label>
                    <input type="password" class="form-control" id="userPassword" name="userPassword" placeholder="비밀번호를 입력하세요" required>
                </div>
                <div class="mb-3">
                    <label for="passwordConfirm" class="form-label">비밀번호 확인</label>
                    <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm" placeholder="비밀번호를 다시 입력하세요" required>
                </div>
                <div class="mb-3">
                    <label for="userNickName" class="form-label">닉네임</label>
                    <input type="text" class="form-control" id="userNickName" name="userNickName" placeholder="사용할 닉네임을 입력하세요" required>
                </div>
                <div class="mb-3">
                    <label for="userEmail" class="form-label">이메일</label>
                    <input type="email" class="form-control" id="userEmail" name="userEmail" placeholder="이메일 주소를 입력하세요" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-block">가입하기</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
